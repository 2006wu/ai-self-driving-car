name: ai-self-driving-car

# OpenPilot/ModelB6 use amd64; Agent and Project 3 use the host's native Linux arch.
services:
  compute:
    build:
      context: ..
      dockerfile: docker/Dockerfile.compute
    platform: linux/amd64
    container_name: ai-self-driving-car-compute
    restart: unless-stopped
    working_dir: /opt/openpilot
    ipc: shareable
    shm_size: "1gb"
    environment:
      PYTHONPATH: "/opt/openpilot"
      OP_SOCKET: "/run/openpilot/replay.sock"
      OP_DATA_DIR: "/data"
    volumes:
      - openpilot-repo:/opt/openpilot
      - replay-data:/data
      - op-socket:/run/openpilot
      - op-runtime:/tmp
    command: ["/usr/local/bin/compute-entrypoint"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -S /run/openpilot/replay.sock &&
          pgrep -f '^python3.8 /usr/local/bin/socket_server.py$' >/dev/null &&
          test -d /opt/openpilot && test -d /data
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  display:
    # Official msgq uses /dev/shm; VisionIPC exchanges FDs over /tmp sockets.
    ipc: service:compute
    pid: service:compute
    build:
      context: ..
      dockerfile: docker/Dockerfile.display
    platform: linux/amd64
    container_name: ai-self-driving-car-display
    restart: unless-stopped
    depends_on:
      compute:
        condition: service_healthy
    environment:
      OP_SOCKET: "/run/openpilot/replay.sock"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      VNC_PASSWORD: "0000"
    ports:
      - "127.0.0.1:5910:5900"
      - "127.0.0.1:6080:6080"
    volumes:
      - openpilot-repo:/opt/openpilot:ro
      - op-socket:/run/openpilot
      - op-runtime:/tmp
    command: ["/usr/local/bin/display-entrypoint"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 /usr/local/bin/display_client.py >/dev/null &&
          pgrep -x Xvfb >/dev/null &&
          pgrep -x x11vnc >/dev/null &&
          pgrep -x openbox >/dev/null &&
          pgrep -f '^python3 /usr/local/bin/launcher.py$' >/dev/null &&
          nc -z 127.0.0.1 5900 && nc -z 127.0.0.1 6080
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  modelb6:
    profiles: ["project2", "all"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.modelb6
    platform: linux/amd64
    working_dir: /workspace/student
    environment:
      PYTHONPATH: "/workspace/professor:/opt/openpilot"
      PYTHONDONTWRITEBYTECODE: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      MPLCONFIGDIR: "/tmp/matplotlib"
    volumes:
      - ../projects/project2/modelb6:/workspace/student:ro
      - ../external/aJLL/ModelB6:/workspace/professor:ro
      - openpilot-repo:/opt/openpilot:ro
      - replay-data:/data:ro
      - modelb6-derived:/derived
      - modelb6-output:/output
    read_only: true
    tmpfs:
      - /tmp
    command: ["python3.8", "/workspace/student/compatibility_check.py"]

  agent:
    profiles: ["project2", "all"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    working_dir: /workspace/projects/project2/agent
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      P2_OUTPUT_MOUNTED: "1"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    volumes:
      - ..:/workspace:ro
      - ../projects/project2/agent/artifacts:/workspace/projects/project2/agent/artifacts
      - modelb6-output:/output:ro
    read_only: true
    tmpfs:
      - /tmp

  project3:
    profiles: ["project3", "all"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.project3
    working_dir: /workspace/projects/project3
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: /workspace/projects/project3
      HOME: /tmp
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ..:/workspace:ro
      - ../projects/project3/artifacts:/workspace/projects/project3/artifacts
      - replay-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp

volumes:
  openpilot-repo:
  replay-data:
  op-socket:
  op-runtime:
  modelb6-derived:
  modelb6-output:
